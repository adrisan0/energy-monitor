[project]
name = "energy-home-monitor-backend"
version = "0.1.0"
description = "Monitor local de energia solar compartida para dos viviendas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13.2",
  "flux-led>=1.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "python-kasa>=0.7.7",
  "psycopg[binary]>=3.2.1",
  "pysonofflanr3>=1.1.4",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-json-logger>=2.0.7",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.2",
]

[project.scripts]
energyctl = "app.cli.main:entrypoint"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
