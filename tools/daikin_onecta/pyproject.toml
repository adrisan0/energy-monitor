[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-home-daikin"
version = "0.1.0"
description = "Isolated Daikin ONECTA cloud and legacy local read client"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
